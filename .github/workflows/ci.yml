name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Examples
        shell: bash
        run: |
          cargo run --quiet -- run examples/hello.kenga
          cargo run --quiet -- run examples/living.kenga
          cargo run --quiet -- run examples/showcase.kenga
          cargo run --quiet -- run examples/agent.kenga
          cargo run --quiet -- run examples/prophet.kenga
          cargo run --quiet -- run examples/prophet_loop.kenga
          cargo run --quiet -- run examples/train.kenga
          cargo run --quiet -- run examples/unroll.kenga
          cargo run --quiet -- run examples/neuromodel.kenga
          cargo run --quiet -- run examples/persist_mind.kenga
          cargo run --quiet -- talk minds/agent.km --script examples/talk_session.txt
          cargo run --quiet -- chat minds/agent.km --script examples/chat_session.txt
          cargo run --quiet -- chat minds/agent.km --script examples/chat_fix.txt
          cargo run --quiet -- run examples/selfhost/arith.kenga
          cargo run --quiet -- run examples/selfhost/mini.kenga
          cargo run --quiet -- run examples/selfhost/iffy.kenga
          cargo run --quiet -- run examples/selfhost/loopfn.kenga
          cargo run --quiet -- run examples/selfhost/bytecode.kenga
          cargo run --quiet -- run examples/selfhost/bc_while.kenga
          cargo run --quiet -- run examples/selfhost/bc_fn.kenga
          cargo run --quiet -- run examples/selfhost/kenga_lite.kenga
          cargo run --quiet -- run examples/ml/world_model.kenga
          cargo run --quiet -- run examples/ml/surprise_gate.kenga
          cargo run --quiet -- demo
          cargo run --quiet -- run examples/stdlib_demo.kenga
          cargo run --quiet -- emit-c examples/native_hello.kenga -o native_hello.c
          cargo run --quiet -- emit-c examples/native_lists.kenga -o native_lists.c
          cargo run --quiet -- emit-c examples/native_struct.kenga -o native_struct.c

      - name: Native build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo run --quiet -- build examples/native_lists.kenga -o /tmp/kenga_native_lists
          /tmp/kenga_native_lists
          cargo run --quiet -- build examples/native_struct.kenga -o /tmp/kenga_native_struct
          /tmp/kenga_native_struct

  lite:
    name: kenga-lite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build kenga-lite
        run: |
          mkdir -p bootstrap/bin
          cc -O2 -std=c99 bootstrap/kenga_lite.c -lm -o bootstrap/bin/kenga-lite

      - name: Selftest
        run: |
          mkdir -p minds
          ulimit -s unlimited
          ./bootstrap/bin/kenga-lite

      - name: Examples (no Rust)
        run: |
          ./bootstrap/bin/kenga-lite run examples/hello.kenga
          ./bootstrap/bin/kenga-lite run examples/prophet.kenga
          ./bootstrap/bin/kenga-lite run examples/selfhost/fact_lite.kenga
          ./bootstrap/bin/kenga-lite run examples/selfhost/foresee_n_lite.kenga
          ./bootstrap/bin/kenga-lite run examples/unroll.kenga
          ./bootstrap/bin/kenga-lite run examples/ml/kenga_net.kenga
          ./bootstrap/bin/kenga-lite run examples/ml/vision_ppm.kenga
          ./bootstrap/bin/kenga-lite run examples/ml/matmul_cl.kenga
