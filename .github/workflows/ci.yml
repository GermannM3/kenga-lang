name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Examples
        shell: bash
        run: |
          cargo run --quiet -- run examples/hello.kenga
          cargo run --quiet -- run examples/living.kenga
          cargo run --quiet -- run examples/showcase.kenga
          cargo run --quiet -- run examples/agent.kenga
          cargo run --quiet -- run examples/prophet.kenga
          cargo run --quiet -- run examples/prophet_loop.kenga
          cargo run --quiet -- run examples/train.kenga
          cargo run --quiet -- run examples/unroll.kenga
          cargo run --quiet -- run examples/native_struct.kenga
          cargo run --quiet -- run examples/stdlib_demo.kenga
          cargo run --quiet -- emit-c examples/native_hello.kenga -o native_hello.c
          cargo run --quiet -- emit-c examples/native_lists.kenga -o native_lists.c
          cargo run --quiet -- emit-c examples/native_struct.kenga -o native_struct.c

      - name: Native build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo run --quiet -- build examples/native_lists.kenga -o /tmp/kenga_native_lists
          /tmp/kenga_native_lists
          cargo run --quiet -- build examples/native_struct.kenga -o /tmp/kenga_native_struct
          /tmp/kenga_native_struct
